services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iopsych_e2e
      POSTGRES_USER: iopsych_e2e
      POSTGRES_PASSWORD: synthetic-local-only
    ports:
      - "127.0.0.1:5544:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iopsych_e2e -d iopsych_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
  mailbox:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1124:1025"
      - "127.0.0.1:8124:8025"
