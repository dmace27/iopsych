name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://iopsych:iopsych@localhost:5432/iopsych

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iopsych
          POSTGRES_PASSWORD: iopsych
          POSTGRES_USER: iopsych
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iopsych -d iopsych" --health-interval 2s
          --health-timeout 5s --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm run api:install

      - name: Migrate, seed, and verify PostgreSQL
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:verify

      - name: Run all checks
        run: |
          mkdir -p security-reports
          set -o pipefail
          npm run check 2>&1 | tee security-reports/checks.log

      - name: Build workspace packages
        run: |
          set -o pipefail
          npm run build 2>&1 | tee security-reports/build.log

      - name: Verify production web/API security integration
        run: |
          set -o pipefail
          npm run security:smoke 2>&1 | tee security-reports/production-smoke.log

      - name: Preserve check and production integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-checks
          path: security-reports/
          retention-days: 14
