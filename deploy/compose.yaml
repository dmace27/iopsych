# Synthetic loopback rehearsal only; not a hosted deployment configuration.
name: iopsych_11a
x-api: &api
  image: iopsych-api:${REVISION:-unknown}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
    args:
      REVISION: ${REVISION:-unknown}
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 35s
  environment:
    IOPSYCH_RELEASE_ID: ${REVISION:-unknown}
    DATABASE_URL: postgresql+psycopg://iopsych_11a:synthetic-local-only@db:5432/iopsych_11a
    INVITE_CANDIDATE_BASE_URL: http://localhost:3106/candidate/invites
    # No signing keys, provider keys, mail adapter or automatic seed.
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: iopsych_11a
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: iopsych_11a
    ports: ["127.0.0.1:5546:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U iopsych_11a -d iopsych_11a"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    <<: *api
    ports: ["127.0.0.1:8106:8000"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  migrate:
    <<: *api
    profiles: [tools]
    command: [alembic, upgrade, head]
  web:
    image: iopsych-web:${REVISION:-unknown}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        REVISION: ${REVISION:-unknown}
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    environment:
      IOPSYCH_RELEASE_ID: ${REVISION:-unknown}
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:3106:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  db-data:
