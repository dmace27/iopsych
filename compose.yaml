name: iopsych-6a

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iopsych_6a
      POSTGRES_PASSWORD: iopsych
      POSTGRES_USER: iopsych
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iopsych -d iopsych_6a"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5541}:5432"
    volumes:
      - iopsych-postgres:/var/lib/postgresql/data

volumes:
  iopsych-postgres:
